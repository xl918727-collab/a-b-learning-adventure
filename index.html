  }

    generation++;

 const picture=q.photo==='flag'?`<span class="flag-photo-crop"><img src="${GAME_ASSETS.flag}" alt="原图中的五星红旗，四颗小星星围着一颗大星星"></span>`:q.photo==='landmark'?`<img class="lesson-photo" src="${GAME_ASSETS.landmark}" alt="北京天安门" width="300" height="120">`:`<span class="lesson-picture" aria-hidden="true">${escapeHTML(q.art||'✨')}</span>`;
 const gap=Array.isArray(q.parts)?`<div class="word-puzzle ${q.scene==='sentence-gap'?'sentence-puzzle':''}"><span>${escapeHTML(q.parts[0])}</span><span class="puzzle-slot" aria-label="待填的字" data-drop="answer">?</span><span>${escapeHTML(q.parts[1])}</span></div>`:q.scene==='pinyin'?`<div class="sound-character" data-drop="answer">${escapeHTML(q.character||q.target||'')}</div>`:`<div class="discovery-slot" data-drop="answer" aria-label="把答案放进来">✨ <span>?</span> ✨</div>`;
 return `<div class="lesson-scene ${q.scene}" data-scene="${q.scene}">${picture}${gap}${q.fullReading?`<p class="full-reading" hidden>${escapeHTML(q.fullReading)}</p>`:''}<div class="discovery-result" hidden aria-live="polite"></div></div>`;
}
function sceneHTML(q){
 if(q.scene)return lessonScene(q);
 if(q.type==='split')return splitScene(q);if(q.type==='ten')return energyScene(q);if(q.type==='order')return orderScene(q);if(q.sequence)return trainScene(q);if(q.compare)return compareScene(q);if(q.bars)return barsScene(q);
 if(['logic-4','logic-10'].includes(q.id))return raceScene();if(['logic-6','logic-9'].includes(q.id))return weightScene(q);
 if(q.module==='hanzi')return magicScene(q);if(q.module==='china')return travelScene(q);
 if(q.id==='split-9')return '<div class="flowers-scene"><div class="flower-group" aria-label="四朵花">🌼<span>🌼</span>🌼<span>🌼</span></div><span class="leftover-flower" aria-label="剩下一朵花">🌼</span><div class="flower-group" aria-label="四朵花">🌼<span>🌼</span>🌼<span>🌼</span></div></div>';
 if(q.id==='logic-8')return `<div class="train-scene"><span class="train-engine" aria-hidden="true">🤝</span><div class="train-cars">${['1','2','3','4','5','6'].map(n=>`<span class="wagon">${n}${pipRow(n)}</span>`).join('')}</div></div>`;
 return calcScene(q);
}
function answerArea(q){if(['split','ten','order'].includes(q.type))return '';return `<div class="answer-options">${round.options.map((value,i)=>`<div class="choice-wrap"><button class="answer-option ${String(value).length>4?'phrase-option':''} ${q.scene==='pinyin'?'pinyin-option':''}" data-option="${i}" data-draggable="answer" aria-label="${escapeHTML(value==='>'?'大于号':value==='<'?'小于号':value==='='?'等于号':value)}">${optionArt(value,q)}</button><button class="choice-listen" data-option-read="${i}" aria-label="听这个选项：${escapeHTML(value)}">🔊 听</button></div>`).join('')}</div>`;}
function renderQuestion(){if(round.shooting){renderShootingQuestion();return;}const q=round.questions[round.index],w=WORLDS.find(x=>x.id===round.module)||WORLDS.find(x=>x.id===q.module),mission=getMission(q);
 screen.innerHTML=`<section class="game-screen" style="--world:${w.color};--soft:${w.soft}" data-question="${q.id}"><div class="game-top"><span class="world-label">${w.icon} ${round.lesson?escapeHTML(LESSONS.find(l=>l.id===round.lesson)?.name||w.name):w.name}</span><div class="round-track" aria-label="已完成${round.index}关，共${round.questions.length}关">${round.questions.map((_,i)=>`<span class="track-star ${i<round.index?'done':i===round.index?'current':''}" aria-hidden="true">⭐</span>`).join('')}</div><span class="round-count">${round.index+1} / ${round.questions.length}</span></div><div class="mission-header"><h1>${escapeHTML(mission.short)}</h1><button class="hint-button" data-action="hint" aria-label="小光，帮帮我">💡</button></div><div class="stage" id="game-stage" aria-label="${escapeHTML(mission.spoken)}">${sceneHTML(q)}</div><div id="answer-area">${answerArea(q)}</div><div class="control-row">${['split','ten','order'].includes(q.type)?`<button class="primary sunny check-answer" data-action="check" ${q.type==='order'?'disabled':''}>${q.type==='split'?'🧺 送好了':q.type==='ten'?'🚀 出发！':'✓ 排好了'}</button>`:''}<div class="success-strip" id="success-strip" role="status" hidden><span class="success-icon" aria-hidden="true">🌟</span><span>帮到小光啦！</span></div><button class="primary" id="next-question" data-action="next" aria-label="${round.index===round.questions.length-1?'打开宝物':'下一关'}" hidden>${round.index===round.questions.length-1?'🎁 开宝物':'下一关 ➜'}</button></div></section>`;
}
function animateTransfer(from,to,emoji='🍎'){if(!from||!to||progress.reducedMotion)return;const a=from.getBoundingClientRect(),b=to.getBoundingClientRect(),el=document.createElement('span');el.className='flying-token';el.textContent=emoji;el.style.left=a.x+a.width/2-20+'px';el.style.top=a.y+a.height/2-20+'px';document.body.append(el);requestAnimationFrame(()=>{if(!el.isConnected)return;el.style.transform=`translate(${b.x+b.width/2-a.x-a.width/2}px,${b.y+b.height/2-a.y-a.height/2}px) scale(.65)`;el.style.opacity='.2';});later(()=>el.remove(),500);}
function popCount(element,count){if(!element)return;const rect=element.getBoundingClientRect(),el=document.createElement('span');el.className='count-bubble';el.textContent=count;el.style.left=rect.x+rect.width/2-15+'px';el.style.top=rect.y+'px';document.body.append(el);later(()=>el.remove(),850);}
function moveApple(index,destination){if(!round||round.solved||!Number.isInteger(index)||index<0||index>=round.apples.length||!['left','right','source'].includes(destination))return;const from=$(`[data-apple="${index}"]`),target=$(`[data-drop="${destination}"]`);animateTransfer(from,target);round.apples[index]=destination;$('#game-stage').innerHTML=splitScene(round.questions[round.index]);blip('drop');($('[data-apple="'+index+'"]')||$('[data-basket="'+round.basket+'"]'))?.focus({preventScroll:true});const count=round.apples.filter(x=>x===destination).length;if(destination!=='source')popCount($(`[data-basket="${destination}"]`),count);}
function toggleEnergy(index){if(!round||round.solved)return;const q=round.questions[round.index];if(q.type!=='ten'||!Number.isInteger(index)||index<q.base||index>9)return;const on=!round.placed.includes(index);round.placed=on?[...round.placed,index]:round.placed.filter(i=>i!==index);const b=$(`[data-cell="${index}"]`);b.classList.toggle('added',on);b.classList.toggle('empty',!on);b.textContent=on?'⭐':'';b.setAttribute('aria-pressed',String(on));b.setAttribute('aria-label',`第${index+1}格，${on?'点一下拿走能量':'点一下加能量'}`);$('#placed-count').textContent=round.placed.length;$('#bean-total').textContent=q.base+round.placed.length;$('#energy-equation-total').textContent=q.base+round.placed.length;blip(on?'drop':'tap');if(on)popCount(b,round.placed.length);}
function editOrder(index,remove=false){if(!round||round.solved)return;const q=round.questions[round.index];if(q.type!=='order'||!Number.isInteger(index)||index<0)return;if(remove){if(index>=round.selected.length)return;round.selected.splice(index,1);}else if(index<q.items.length&&!round.selected.includes(index))round.selected.push(index);else return;
 document.querySelectorAll('[data-slot]').forEach((b,i)=>{const n=round.selected[i],value=n===undefined?null:q.items[n];b.innerHTML=value===null?i+1:GAME_WORD_ART[value]||escapeHTML(value);b.disabled=n===undefined;b.classList.toggle('occupied',n!==undefined);b.setAttribute('aria-label',value===null?`第${i+1}个位置，空`:`第${i+1}个：${value}，点一下拿回来`);});document.querySelectorAll('[data-order]').forEach(b=>b.disabled=round.selected.includes(Number(b.dataset.order)));$('[data-action="check"]').disabled=round.selected.length!==q.answer.length;blip('drop');if(!remove&&OPTION_AUDIO[q.items[index]])playAudio(OPTION_AUDIO[q.items[index]]);}
function celebrate(){const effects=$('#effects');for(let i=0;i<22;i++){const el=document.createElement('span');el.className='sparkle';el.textContent=['⭐','✨','💛','🌟'][i%4];el.style.setProperty('--x',(Math.cos(i*2.4)*(95+i*10))+'px');el.style.setProperty('--y',(Math.sin(i*2.4)*170+60)+'px');el.style.setProperty('--r',(i*45)+'deg');el.style.animationDelay=(i%4)*.025+'s';effects.append(el);}$('#hero-dock').classList.add('hero-happy');later(()=>{effects.replaceChildren();$('#hero-dock').classList.remove('hero-happy');},1600);}
function answer(value,button){if(!round||round.solved||currentView!=='game')return;stopVoice();const q=round.questions[round.index];const correct=Array.isArray(q.answer)?Array.isArray(value)&&value.length===q.answer.length&&value.every((v,i)=>v===q.answer[i]):String(value)===q.answer;
 stopAudio();encouragementIndex=(encouragementIndex%3)+1;
 if(!correct){round.failed=true;if(!progress.review.includes(q.id))progress.review.push(q.id);save();if(button){button.classList.remove('try-again');void button.offsetWidth;button.classList.add('try-again');}say('没关系，我们再试试！','retry'+encouragementIndex,true);return;}
 round.solved=true;if(!round.failed&&!round.hadHelp)round.correctFirst++;if(!progress.solved.includes(q.id)){progress.solved.push(q.id);round.newStars++;}if(round.fromReview&&!round.failed&&!round.hadHelp)progress.review=progress.review.filter(id=>id!==q.id);
 if(q.type==='split'){round.apples=round.apples.map((_,i)=>i<q.left?'left':'right');$('#game-stage').innerHTML=splitScene(q);}
 if(q.type==='ten'&&round.placed.length!==Number(q.answer)){for(let i=q.base;i<10;i++){const el=$(`[data-cell="${i}"]`);el.classList.add('added');el.classList.remove('empty');el.textContent='⭐';}$('#bean-total').textContent='10';$('#energy-equation-total').textContent='10';$('#placed-count').textContent=q.answer;}
 if(q.sequence){const unknowns=[...document.querySelectorAll('.wagon.unknown')],values=q.answer.split('，');unknowns.forEach((el,i)=>{el.innerHTML=symbol(values[i]||q.answer);el.classList.remove('unknown');});}
 if(q.compare&&$('.mouth-symbol'))$('.mouth-symbol').textContent=q.answer;
 if(round.shooting)markShootingCorrect(q,button);
 if(q.scene&&!round.shooting){
 const slot=$('.puzzle-slot');if(slot){animateTransfer(button,slot,q.answer);slot.textContent=q.answer;slot.classList.add('filled');slot.removeAttribute('data-drop');slot.setAttribute('aria-label',q.answer);}
 const reading=$('.full-reading');if(reading)reading.hidden=false;
 const reveal=$('.discovery-result');reveal.textContent=q.displayCompleted||q.answer;reveal.hidden=Boolean(slot);const unknown=$('.discovery-slot');if(unknown)unknown.hidden=true;
 }else if(q.module==='hanzi'&&q.type!=='order'&&$('.magic-target'))$('.magic-target').innerHTML=GAME_WORD_ART[q.answer]||`<span class="magic-word">${escapeHTML(q.answer)}</span>`;
 document.querySelectorAll('#game-stage button,#answer-area .answer-option,[data-action="check"]').forEach(b=>b.disabled=true);if(button)button.classList.add('correct');
 $('#game-stage').classList.add('solved');$('#success-strip').hidden=false;$('#next-question').hidden=false;const check=$('[data-action="check"]');if(check)check.hidden=true;$('.hint-button').disabled=true;
 save();celebrate();say(['太棒啦，击个掌！','你帮到我啦！','成功啦，小英雄！'][encouragementIndex-1],q.completed?'learn-'+q.id:'success'+encouragementIndex,true);$('#next-question').focus({preventScroll:true});
}
function checkAnswer(){if(!round||round.solved)return;const q=round.questions[round.index];if(q.type==='split'){const ready=!round.apples.includes('source')&&round.apples.filter(x=>x==='left').length===q.left;answer(ready?String(round.apples.filter(x=>x==='right').length):'incomplete');}else if(q.type==='ten')answer(String(round.placed.length));else if(q.type==='order')answer(round.selected.map(i=>q.items[i]));}
function showHint(){if(!round||round.solved)return;stopVoice();const q=round.questions[round.index];round.hadHelp=true;if(!progress.review.includes(q.id))progress.review.push(q.id);save();$('#game-stage').classList.add('hint-on');clearTimeout(hintTimer);hintTimer=setTimeout(()=>$('#game-stage')?.classList.remove('hint-on'),8000);say('跟我一起，再看一看。','hint-'+q.id,true);if(q.id==='logic-4')runRace(false);}
function runRace(narrate=true){const el=$('#race-track');if(!el)return;el.classList.remove('race-active');void el.offsetWidth;el.classList.add('race-active');if(narrate)playAudio('read-'+round.questions[round.index].id);}
function nextQuestion(){if(!round?.solved)return;round.index++;if(round.index>=round.questions.length)finishRound();else prepareQuestion();}
function finishRound(){stopScene();currentView='result';progress.rounds++;const w=WORLDS.find(x=>x.id===round.module);if(!round.fromReview&&w&&!progress.stickers.includes(w.id))progress.stickers.push(w.id);save();screen.innerHTML=`<section class="result-screen"><span class="reward-chest" aria-hidden="true">${w?w.icon:'🌻'}</span><h1>小英雄，任务完成！</h1><div class="reward-name">${round.shooting?'瞄准小能手':round.fromReview?'勇敢再试一次':w.reward}</div><div class="result-stars" aria-label="本轮新收集${round.newStars}颗星星">⭐ + ${round.newStars}</div><p class="break-note">🌤️ 伸个懒腰，看看远处吧</p><div class="result-actions">${round.shooting?`<button class="primary" data-shoot-category="${round.shootCategory}">🎯 再玩一轮</button><button class="secondary" data-action="shoot-menu">换个靶场</button>`:''}${round.lesson?`<button class="primary" data-continue-lesson="${round.lesson}">▶ 再玩 5 关</button><button class="secondary" data-world="${round.module}">🧭 换个小天地</button>`:''}<button class="primary" data-view="stickers">🎁 我的宝物</button><button class="secondary" data-view="home">🗺️ 回地图</button></div></section>`;focusTitle();celebrate();say('任务完成！宝物送给你！','complete',true);}
function stickers(){screen.innerHTML=`<section class="section-screen"><h1 class="section-title">我的宝物箱 🎁</h1><div class="treasure-grid">${WORLDS.map(w=>{const earned=progress.stickers.includes(w.id);return `<article class="treasure-card ${earned?'collected':''}"><span class="treasure-icon" aria-hidden="true">${w.icon}</span><h2>${w.reward}</h2><button class="secondary" data-world="${w.id}" aria-label="${earned?'再玩一次':'去收集'}${w.name}">${earned?'⭐ 再玩':'▶ 去找'}</button></article>`;}).join('')}</div><div class="collection-tools">${progress.review.length?`<button class="secondary" data-view="review">🌱 再帮小光一次 · ${progress.review.length}</button>`:''}<button class="secondary" data-view="home">🗺️ 回地图</button></div></section>`;guideKey='stickers';guideLine='看，你收集到的宝物！';$('#hero-line').textContent=guideLine;}
function review(){screen.innerHTML=`<section class="section-screen"><div class="empty-state"><span aria-hidden="true">${progress.review.length?'🌱':'🌈'}</span><h1>${progress.review.length?'再帮小光一次吧！':'这里的任务都做好啦！'}</h1><button class="primary" ${progress.review.length?'data-action="review-start"':'data-view="home"'}>${progress.review.length?'▶ 再玩一次':'🗺️ 去地图'}</button></div></section>`;guideKey='review';guideLine='再试一次，也是一种本领！';$('#hero-line').textContent=guideLine;}
function parents(){screen.innerHTML=`<section class="section-screen"><h1 class="section-title">家长设置</h1><div class="parent-layout"><section class="parent-section"><h2>怎么玩更合适</h2><p>每轮最多 5 关。默认先分实物、看画面，再认识数字和汉字。小光会自动用国语讲解；错了不扣星，不计时。</p><div class="setting-options" role="group" aria-label="学习难度">${[['easy','🌱 轻松起步'],['challenge','🔎 小小挑战']].map(([value,label])=>`<button class="setting-option ${progress.difficulty===value?'selected':''}" data-difficulty="${value}" aria-pressed="${progress.difficulty===value}">${label}</button>`).join('')}</div><p class="subtle">下一轮生效。挑战模式保留资料中的进位、连加减和多步推理。</p><div class="setting-options"><button class="setting-option ${progress.autoRead?'selected':''}" data-action="toggle-guide" aria-pressed="${progress.autoRead}">自动讲解：${progress.autoRead?'开':'关'}</button><button class="setting-option ${progress.reducedMotion?'selected':''}" data-action="toggle-motion" aria-pressed="${progress.reducedMotion}">减少动画：${progress.reducedMotion?'开':'关'}</button></div></section><section class="parent-section"><h2>国语语音答题</h2><p>点下方麦克风，用普通话说数字、颜色、形状或选项。识别后会显示听到的答案，孩子再点绿色按钮确认。也能说“再听一次”“提示”“下一关”。排序关用点选操作。</p><p>浏览器支持情况：${LearningVoice.supported?'检测到语音接口，实际可用性取决于浏览器和网络。':'当前浏览器没有提供语音接口，请用支持语音识别的系统浏览器尝试。'}</p><p>语音识别通常需要联网，可能由浏览器的语音服务处理声音。仅点击后开始，每次最多 8 秒；网页不保存录音或识别文本。离线时，所有点击游戏、内置国语讲解和鼓励音效都能使用。</p><div class="setting-options"><button class="setting-option ${progress.voiceEnabled?'selected':''}" data-action="voice-settings" aria-pressed="${progress.voiceEnabled}">${progress.voiceEnabled?'关闭语音答题':'开启语音答题'}</button></div></section><section class="parent-section"><h2>已经走了多远</h2><div class="parent-stats"><span><b>${progress.solved.length}</b> 颗星</span><span><b>${progress.rounds}</b> 次冒险</span><span><b>${progress.review.length}</b> 个待巩固</span></div><p>同一道题重复答对不会重复加星。答错或使用提示的题进入巩固任务；复习时独立答对后移出。完成一个主题的整轮冒险会获得宝物。</p><p>记录仅保存在当前浏览器，不会跨设备同步。${storageOK?'当前可以保存记录。':'当前浏览器无法保存，关闭后可能丢失本次记录。'}</p><button class="secondary" data-view="review">看看巩固任务</button></section><section class="parent-section"><h2>陪孩子玩</h2><p>“光能射击”入口在地图下方：鼠标移动瞄准，左键发射，打中题目答案得星；换题、换靶场也只需点击。手机可直接点靶。能量无限，无需键盘、装弹或限时操作。射击模式和原关卡共用学习记录，长句和排序题继续在原课文关卡里玩。</p><p>让孩子先看小光的示范，再自己点、拖、摆。苹果可以点回桌面，能量可以拿走，排错队也可以撤回。每个选项下的小喇叭都能朗读。</p><p>如果声音未响，请点一次小光或“再听”，并打开设备媒体音量。页面切换到后台会停止声音和麦克风。配音已统一为您选择的“小光伙伴”男声（普通话 Yunxi），采用原音高、稍慢语速。所有声音预先制作并内置，答对会朗读完整词句；答错有温和鼓励。</p><p>小光是为这个学习游戏制作的卡通英雄伙伴。</p><p class="subtle">天安门照片：<a href="https://commons.wikimedia.org/wiki/File:Front_view_of_Tiananmen_gate_from_north_end_of_Tiananmen_Square.jpg" target="_blank" rel="noopener noreferrer">Daniel Case / Wikimedia Commons</a>，<a href="https://creativecommons.org/licenses/by-sa/3.0/" target="_blank" rel="noopener noreferrer">CC BY-SA 3.0</a>（使用 Wikimedia 缩略图）。</p></section><section class="parent-section wide"><h2>资料与游戏的对应关系</h2><p>现有 ${QUESTIONS.length} 道游戏题，保留原题和学习记录。本次逐项加入新上传五张图片中的 ${CURRICULUM_COVERAGE.learningCount} 条学习内容，涵盖识字、读音、每个组词、完整例句、课文理解和祖国知识。故事与操作方式做了改编，原资料文件未修改。</p><table class="source-table"><thead><tr><th>游戏</th><th>学习内容与来源</th></tr></thead><tbody><tr><td>苹果派对</td><td>数学讲义 01–02 页：数字分合、口算、能否平分</td></tr><tr><td>飞船出发</td><td>数学讲义 03–04 页：凑十、凑整、连加减</td></tr><tr><td>彩虹火车</td><td>数学讲义 05–07 页：数字与图形规律</td></tr><tr><td>动物运动会</td><td>数学讲义 08–10 页：长度、轻重、快慢及比较</td></tr><tr><td>汉字魔法</td><td>新图片 1–4：《天地人》《金木水火土》《口耳目手足》《日月山川》《语文园地一》</td></tr><tr><td>热气球旅行</td><td>新图片 5：祖国、民族、国旗知识、天安门；并保留原有大熊猫等题目</td></tr></tbody></table><details class="coverage-details"><summary>查看五张图片的逐项覆盖清单（${CURRICULUM_COVERAGE.learningCount} / ${CURRICULUM_COVERAGE.learningCount}）</summary>${CURRICULUM_COVERAGE.images.map(image=>`<h3>${escapeHTML(image.title)}</h3><ul>${image.facts.map(f=>`<li>${escapeHTML(f.exact_text)} <small>· ${f.questionIds.length} 道关联题</small></li>`).join('')}</ul>`).join('')}</details></section></div></section>`;guideKey='parents';guideLine='大人可以在这里帮帮忙。';$('#hero-line').textContent=guideLine;}
function voiceFailure(reason){const unavailable=['unsupported','not-allowed','service-not-allowed','audio-capture','language-not-supported','unavailable'].includes(reason);say(unavailable?'先用手指玩，我也陪着你！':'没听清，再说一次也可以。',unavailable?'voice-unavailable':'voice-error',true);const messages={'not-allowed':'麦克风没有被允许。请让大人在浏览器里开启，或继续点选。','service-not-allowed':'这个浏览器暂时不能语音识别，可以继续点选。','network':'语音识别需要可用的网络，点选和国语配音仍然可以用。','audio-capture':'没有检测到可用麦克风，可以继续点选。'};if(messages[reason])toast(messages[reason]);}
function requestVoice(){if(voiceListening){stopVoice();return;}if(currentView!=='game'||!round){say('先选个地方，我们去玩！','welcome',true);return;}if(!LearningVoice.supported){voiceFailure('unsupported');return;}if(!round.solved&&round.questions[round.index].type==='order'){say('这一关，把朋友点进去吧。','voice-order',true);return;}if(!progress.voiceEnabled){stopAudio();$('#voice-permission').showModal();playAudio('voice-permission');return;}startVoice();}
function startVoice(){if(currentView!=='game'||!round)return;stopAudio();stopVoice();const ticket=sceneTicket,q=round.questions[round.index];LearningVoice.start({question:q,isCurrent:()=>sceneTicket===ticket&&currentView==='game'&&round?.questions[round.index]?.id===q.id,onFailure:voiceFailure,onResult:result=>{
 if(result.type==='command'){if(result.value==='read')repeatGuide();if(result.value==='hint')showHint();if(result.value==='home')navigate('home');if(result.value==='next'){if(round.solved)nextQuestion();else repeatGuide();}return;}
 if(round.solved){say('点箭头，或说下一关。','next-ready',true);return;}
 pendingVoice={value:result.value,ticket,id:q.id};$('#heard-answer').innerHTML=optionArt(result.value,q);$('#heard-transcript').textContent='听到：“'+result.transcript+'”';$('#voice-result').showModal();say('是这个吗？点绿色按钮。','voice-confirm',true);
 }});}
let drag=null,suppressClickUntil=0;
function cancelDrag(){if(drag){drag.element?.classList.remove('dragging');drag.ghost?.remove();drag=null;}document.querySelectorAll('.drop-ready').forEach(el=>el.classList.remove('drop-ready'));}
function canDrop(type,target){if(!target)return false;const zone=target.dataset.drop;return type==='apple'?['left','right','source'].includes(zone):type==='energy'?zone.startsWith('energy-')&&!target.disabled&&target.classList.contains('empty'):type==='order'?zone==='order':zone==='answer';}
function handleDrop(d,target){if(!round||round.solved)return;const zone=target.dataset.drop;if(d.type==='apple')moveApple(Number(d.element.dataset.apple),zone);if(d.type==='energy')toggleEnergy(Number(zone.slice(7)));if(d.type==='answer')answer(round.options[Number(d.element.dataset.option)],d.element);if(d.type==='order')editOrder(Number(d.element.dataset.order));}
// Pointer gestures share the same actions as buttons; every drag also has a tap path.
document.addEventListener('pointerdown',event=>{const el=event.target.closest('[data-draggable]');if(!el||el.disabled||!round||round.solved||event.button!==0)return;drag={element:el,type:el.dataset.draggable,startX:event.clientX,startY:event.clientY,pointerId:event.pointerId,moved:false,ghost:null};});
document.addEventListener('pointermove',event=>{if(!drag||drag.pointerId!==event.pointerId)return;if(!drag.moved&&Math.hypot(event.clientX-drag.startX,event.clientY-drag.startY)<9)return;event.preventDefault();if(!drag.moved){drag.moved=true;drag.element.classList.add('dragging');drag.ghost=document.createElement('div');drag.ghost.className='drag-ghost';drag.ghost.textContent=drag.type==='apple'?'🍎':drag.type==='energy'?'⭐':drag.element.querySelector('.option-art')?.textContent||drag.element.innerText;document.body.append(drag.ghost);}drag.ghost.style.left=event.clientX+'px';drag.ghost.style.top=event.clientY+'px';document.querySelectorAll('.drop-ready').forEach(el=>el.classList.remove('drop-ready'));const target=document.elementFromPoint(event.clientX,event.clientY)?.closest('[data-drop]');if(canDrop(drag.type,target))target.classList.add('drop-ready');},{passive:false});
document.addEventListener('pointerup',event=>{if(!drag||drag.pointerId!==event.pointerId)return;const d=drag,target=document.elementFromPoint(event.clientX,event.clientY)?.closest('[data-drop]');cancelDrag();if(d.moved){suppressClickUntil=Date.now()+400;if(canDrop(d.type,target))handleDrop(d,target);}});
document.addEventListener('pointercancel',cancelDrag);
document.addEventListener('click',event=>{
 if(Date.now()<suppressClickUntil){event.preventDefault();return;}const b=event.target.closest('button');if(!b||b.disabled)return;
 if(b.dataset.view){navigate(b.dataset.view);return;}if(b.dataset.world){openWorld(b.dataset.world);return;}
 if(b.dataset.lesson||b.dataset.continueLesson){const l=LESSONS.find(x=>x.id===(b.dataset.lesson||b.dataset.continueLesson));if(l)begin(l.module,false,l.id);return;}
 if(b.dataset.lessonListen){const l=LESSONS.find(x=>x.id===b.dataset.lessonListen);if(l)say(l.line,'lesson-'+l.id,true);return;}
 if(b.id==='mute-toggle'){progress.muted=!progress.muted;stopAudio();stopVoice();save();if(!progress.muted)repeatGuide();return;}
 if(b.id==='hero-repeat'||b.dataset.action==='read'){repeatGuide();return;}if(b.id==='mic-button'){requestVoice();return;}
 if(b.id==='keep-playing'){pendingNavigation=null;$('#leave-dialog').close();repeatGuide();return;}if(b.id==='leave-game'){const dest=pendingNavigation||'home';pendingNavigation=null;$('#leave-dialog').close();view(dest);return;}
 const action=b.dataset.action;
 if(action==='shoot-menu'){showShootingIntro();return;}
 if(b.dataset.shootCategory){beginShooting(b.dataset.shootCategory);return;}
 if(action==='quick-start'){openWorld((WORLDS.find(w=>!progress.stickers.includes(w.id))||WORLDS[0]).id);return;}
 if(action==='demo'){$('.intro-demo').classList.add('demo-done');animateTransfer(b,$('.demo-target'),introWorld.id==='split'?'🍎':introWorld.id==='ten'?'⭐':introWorld.id==='hanzi'?'木':'✨');b.textContent=introWorld.id==='ten'?'⭐':introWorld.id==='hanzi'?'🌳':'✓';if(introWorld.id==='split')$('.demo-target').textContent='🐼 🍎';blip('drop');say('就是这样！一起出发吧！','demo-done',true);return;}
 if(action==='begin'){begin(introWorld.id);return;}
 if(b.dataset.difficulty){progress.difficulty=b.dataset.difficulty;save();parents();return;}
 if(action==='toggle-guide'){progress.autoRead=!progress.autoRead;save();parents();if(progress.autoRead)repeatGuide();else stopAudio();return;}
 if(action==='toggle-motion'){progress.reducedMotion=!progress.reducedMotion;save();parents();return;}
 if(action==='voice-settings'){if(progress.voiceEnabled){progress.voiceEnabled=false;stopVoice();save();parents();}else{$('#voice-permission').showModal();playAudio('voice-permission');}return;}
 if(action==='voice-enable'){progress.voiceEnabled=true;$('#voice-permission').close();stopAudio();save();if(currentView==='parents')parents();else startVoice();return;}
 if(action==='voice-cancel'){$('#voice-permission').close();stopAudio();return;}
 if(action==='voice-again'){pendingVoice=null;$('#voice-result').close();startVoice();return;}
 if(action==='voice-confirm'){const pending=pendingVoice;pendingVoice=null;$('#voice-result').close();if(pending&&sceneTicket===pending.ticket&&round?.questions[round.index]?.id===pending.id){const button=[...document.querySelectorAll('[data-option]')].find(el=>round.options[Number(el.dataset.option)]===pending.value);answer(pending.value,button);}return;}
 if(action==='review-start'){begin(null,true);return;}
 if(!round||currentView!=='game')return;const q=round.questions[round.index];
 if(action==='next'){nextQuestion();return;}if(action==='hint'){showHint();return;}
 if(b.dataset.optionRead!==undefined){const value=round.options[Number(b.dataset.optionRead)];stopVoice();playAudio(window.QUESTION_OPTION_AUDIO?.[q.id]?.[value]||OPTION_AUDIO[value],true);return;}
 if(round.solved)return;
 if(b.dataset.option!==undefined){answer(round.options[Number(b.dataset.option)],b);return;}
 if(b.dataset.basket){round.basket=b.dataset.basket;$('#game-stage').innerHTML=splitScene(q);blip();$(`[data-basket="${round.basket}"]`)?.focus({preventScroll:true});return;}
 if(b.dataset.apple!==undefined){const i=Number(b.dataset.apple),dest=round.apples[i]==='source'?round.basket:'source';moveApple(i,dest);return;}
 if(b.dataset.cell!==undefined){toggleEnergy(Number(b.dataset.cell));return;}
 if(b.dataset.order!==undefined){editOrder(Number(b.dataset.order));return;}
 if(b.dataset.slot!==undefined){editOrder(Number(b.dataset.slot),true);return;}
 if(action==='add-energy'){const empty=Array.from({length:10},(_,i)=>i).find(i=>i>=q.base&&!round.placed.includes(i));if(empty!==undefined)toggleEnergy(empty);return;}
 if(action==='take-apples'){const scene=$('.subtraction-scene');scene.classList.remove('take-active');void scene.offsetWidth;scene.classList.add('take-active');blip('drop');return;}
 if(action==='check'){checkAnswer();return;}if(action==='race'){runRace();return;}
 if(action==='feed'){$('.panda-scene').classList.remove('fed');void b.offsetWidth;$('.panda-scene').classList.add('fed');blip();return;}
 if(b.dataset.countStar!==undefined){const i=Number(b.dataset.countStar);if(round.counted.includes(i))return;round.counted.push(i);b.textContent='⭐';b.setAttribute('aria-pressed','true');popCount(b,round.counted.length);blip('drop');const key=OPTION_AUDIO[String(round.counted.length)];if(key)playAudio(key);}
});
$('#leave-dialog').addEventListener('cancel',()=>{pendingNavigation=null;stopAudio();});
for(const id of ['voice-permission','voice-result'])$('#'+id).addEventListener('cancel',()=>{stopAudio();pendingVoice=null;LearningVoice.stop();});
window.addEventListener('pagehide',()=>{stopScene();if(fxContext)void fxContext.suspend().catch(()=>{});});
document.addEventListener('visibilitychange',()=>{if(document.hidden){stopAudio();stopVoice();cancelDrag();if(fxContext)void fxContext.suspend().catch(()=>{});}});

const assetLoader=document.getElementById('asset-loader'),loaderBar=document.getElementById('loader-progress'),loaderLabel=document.getElementById('loader-label');
const criticalAssets=[GAME_ASSETS.hero,GAME_ASSETS.map];let loadedAssets=0;
function finishAssetLoad(){assetLoader.classList.add('ready');setTimeout(()=>assetLoader.remove(),400)}
criticalAssets.forEach(src=>{const image=new Image();const done=()=>{loadedAssets++;const percent=Math.round(loadedAssets/criticalAssets.length*100);loaderBar.style.width=percent+'%';loaderLabel.textContent='准备图片 '+percent+'%';if(loadedAssets===criticalAssets.length)finishAssetLoad()};image.onload=done;image.onerror=done;image.src=src;if(image.complete)done();});
setTimeout(finishAssetLoad,6000);
$('#hero-image').src=GAME_ASSETS.hero;$('#adventure-background').src=GAME_ASSETS.map;home();updateChrome();
// Existing optional read-only learning context stays available without exposing answers.
if(document.modelContext?.registerTool){const lifecycle=new AbortController();try{Promise.resolve(document.modelContext.registerTool({name:'read_learning_progress',title:'查看学习进度',description:'Read local learning progress without revealing answers or changing game state.',inputSchema:{type:'object',properties:{},additionalProperties:false},annotations:{readOnlyHint:true,untrustedContentHint:false},execute(input){if(!input||typeof input!=='object'||Array.isArray(input)||Object.keys(input).length)throw new Error('Expected an empty object');return {stars:progress.solved.length,stickers:progress.stickers.length,reviewQuestions:progress.review.length,completedRounds:progress.rounds,difficulty:progress.difficulty};}},{signal:lifecycle.signal})).catch(()=>{});}catch{}window.addEventListener('pagehide',()=>lifecycle.abort(),{once:true});}
</script></body>
